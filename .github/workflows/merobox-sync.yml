name: Merobox Sync (2 nodes)

# Backend/protocol-level sync checks: boot two real merod nodes in Docker via
# merobox, mesh a shared kv_store context across them, and assert writes
# replicate across nodes AND the context state hash converges (i.e. actually
# initializes — not the all-ones "uninitialized" hash). Two scenarios:
#   * sync-two-node.yml       — node 1 -> node 2
#   * sync-two-node-bidi.yml  — node 1 -> node 2 AND node 2 -> node 1
# This is the node + WASM + sync signal underneath the Android chat e2e, isolated
# from the curb app and the emulator.
#
# Docker-based, so it runs on ubuntu (the macOS runners the Android suites use have
# no Docker). Not a blanket PR gate: it runs on main pushes / weekly / on demand,
# plus PRs that touch the merobox harness itself.
#
# Node image and app fixture both come from ONE pinned core release (ci/core-version):
# the merod image is the rc tag, and the kv-store bundle is that release's own
# `kv-store-test-fixture.mpk` asset. Pinning both together is what stops this lane
# reddening on a commit of its own — it used to track `edge` against a wasm vendored
# ten releases earlier, so node and app drifted apart independently.
#
# GATING: a red run means a genuine regression (node sync broke at the pinned
# release, or the harness did). The always-on node-log + peer-connectivity dump
# makes such a failure quick to triage ("nodes never peered" vs "peered but state
# didn't sync").
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'ci/merobox/**'
      - '.github/workflows/merobox-sync.yml'
  workflow_dispatch:
    inputs:
      merod_image:
        description: 'merod Docker image (default: MEROD_IMAGE from ci/core-version)'
        required: false
        default: ''
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - sync-two-node.yml
          - sync-two-node-bidi.yml
    env:
      MEROD_IMAGE_OVERRIDE: ${{ github.event.inputs.merod_image }}
      WF: ci/merobox/${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the pinned core release
        run: |
          . ./ci/core-version
          echo "CORE_TAG=$CORE_TAG" >> "$GITHUB_ENV"
          echo "MEROD_IMAGE=${MEROD_IMAGE_OVERRIDE:-$MEROD_IMAGE}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pin the PAIR. `pip install merobox` alone pins nothing that matters:
      # calimero-client-py is an unpinned transitive dep that tracks core's master,
      # and a client-py release has broken every unpinned merobox install before
      # (0.7.0 dropped a kwarg merobox passed). Bump both together, deliberately.
      - name: Install merobox
        run: |
          python -m pip install --upgrade pip
          pip install 'merobox==0.6.75' 'calimero-client-py==0.7.0'
          merobox --version
          pip show calimero-client-py | sed -n '1,2p'

      # The app fixture ships WITH the node: every core release publishes a
      # `kv-store-test-fixture.mpk` built from that release's SDK, so the app can
      # never drift from the node the way a vendored wasm does. It must stay an
      # .mpk — a dev install refuses a raw .wasm.
      - name: Fetch the kv-store bundle from the pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci/merobox/res
          gh release download "$CORE_TAG" --repo calimero-network/core \
            --pattern 'kv-store-test-fixture.mpk' \
            --output ci/merobox/res/kv-store.mpk --clobber
          ls -la ci/merobox/res/kv-store.mpk

      - name: Pull merod image
        run: docker pull "$MEROD_IMAGE"

      # The scenario files carry the real pinned image so they also run standalone
      # (`merobox bootstrap run ci/merobox/<scenario>`). Assert they agree with
      # ci/core-version — a half-landed bump would otherwise run the OLD node here
      # and report green — then apply any dispatch override.
      - name: Check the scenario image matches ci/core-version
        run: |
          set -euo pipefail
          declared=$(awk '/^  image:/{print $2; exit}' "$WF")
          . ./ci/core-version
          [ "$declared" = "$MEROD_IMAGE" ] || {
            echo "::error::$WF pins $declared but ci/core-version says $MEROD_IMAGE"; exit 1; }
          echo "image pin agrees: $declared"

      - name: Apply the dispatch image override
        if: env.MEROD_IMAGE_OVERRIDE != ''
        run: |
          sed -i "s#^  image: .*#  image: ${MEROD_IMAGE}#" "$WF"
          grep 'image:' "$WF"

      - name: Validate workflow
        run: merobox bootstrap validate "$WF"

      - name: Run sync check
        run: |
          set -o pipefail
          merobox bootstrap run "$WF" 2>&1 | tee merobox-run.log

      - name: Summarize result
        if: always()
        run: |
          {
            echo "## ${{ matrix.scenario }}"
            if grep -q "Sync verification failed" merobox-run.log 2>/dev/null; then
              echo ":warning: **Context state did NOT converge** — the known cross-node"
              echo "sync issue (a node stuck on the all-ones uninitialized hash). This job"
              echo "is informational; final per-node state below."
              echo ""
              echo '```'
              sed -n '/Final state:/,/failed/p' merobox-run.log | head -30
              echo '```'
            elif grep -qE "All assertions passed|Workflow completed successfully" merobox-run.log 2>/dev/null; then
              echo ":white_check_mark: Sync converged and the write(s) replicated across nodes."
            else
              echo "See job log — no clear pass/fail marker found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always capture node logs + connectivity so a failure can be diagnosed as
      # "nodes never peered" (discovery/networking) vs "peered but state didn't
      # sync" (the sync path itself). Best-effort greps — never fail the step.
      - name: Node logs + connectivity
        if: always()
        run: |
          {
            echo "### Peer connectivity (best-effort grep of node logs)"
            echo '```'
            for c in $(docker ps -a --format '{{.Names}}' | grep -i calimero || true); do
              hits=$(docker logs "$c" 2>&1 | grep -icE "connection established|peer connected|dial success|mdns|kad|identified peer" || true)
              echo "$c: $hits peer/discovery log line(s)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for c in $(docker ps -a --format '{{.Names}}' | grep -i calimero || true); do
            echo "::group::docker logs $c"
            docker logs "$c" 2>&1 | tail -200 || true
            echo "::endgroup::"
          done

      - name: Tear down nodes
        if: always()
        run: |
          merobox stop --all 2>/dev/null || true
          merobox nuke -f 2>/dev/null || true
