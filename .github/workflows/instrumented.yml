name: Instrumented Tests

# Android instrumented tests (the analog of Swift's XCUITest): builds the Compose
# sample app and drives login → home → RPC → logout in an Android emulator against
# an IN-APP MOCK (no node). This is the PR gate for UI behaviour.
#
# Node-backed / multi-user e2e is heavier (real merod, cross-user sync) and does
# NOT run here — it lives in android-e2e.yml (manual / main / weekly).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented-tests:
    name: connectedDebugAndroidTest (emulator, in-app mock)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Hardware acceleration for the emulator. Without KVM the x86_64 emulator
      # boots under software rendering only and is far too slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ⚠️ NO AVD CACHE — restoring one hangs the emulator on these runners.
      #
      # Measured 2026-09-09 on one job, three attempts, only the cache varied:
      #
      #   restore a cache saved AFTER a test run   → hung, killed at the 45m timeout
      #   NO cache, create the AVD in-job          → PASSED in ~3 minutes
      #   restore a cache saved BEFORE any test    → hung again
      #
      # So it is the RESTORE that breaks it, not staleness and not when the cache was
      # written — a freshly created, immediately saved AVD fails the same way. A
      # restored AVD boots far enough for adb and then never registers its system
      # services:
      #
      #   android.os.ServiceManager$ServiceNotFoundException: No service published for: input
      #   ##[error]The process '…/platform-tools/adb' failed with exit code 1
      #
      # …after which the job idles to `timeout-minutes`, so 90 seconds of work is
      # reported as a 45-minute failure. With a fixed key it could never self-heal:
      # every run restored the same thing, which is why RE-RUNNING NEVER HELPED.
      # That cost two hours across three branches on 2026-09-09, one of which
      # changed only `docs/package-lock.json`.
      #
      # Creating the AVD in-job costs ~2 minutes and is reliable. If you reinstate a
      # cache, prove it by running the job TWICE — the second run is the one that
      # restores, and the first will happily mislead you.
      - name: Create AVD (not cached — see above)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created for this job."

      - name: Run instrumented tests (in-app mock)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NOTE: android-emulator-runner runs this script with /usr/bin/sh (dash), which does
          # NOT support `set -o pipefail`. Redirect to a log file (instead of piping through tee)
          # so the gradle exit code propagates and a real test failure fails the job.
          # Single-line gradle invocation: the action runs this under sh and backslash line
          # continuations don't survive (the `\` gets passed to gradle as a task name).
          # In-app mock only — node/multi-user e2e classes run in android-e2e.yml; filter them out.
          script: |
            ./gradlew :sample-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.calimero.mero.sample.AppE2ETest,com.calimero.mero.sample.ChatMultiUserTest --stacktrace > instrumented.log 2>&1 || { cat instrumented.log; exit 1; }
            cat instrumented.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-logs
          path: |
            instrumented.log
            sample-app/build/reports/androidTests/
            sample-app/build/outputs/androidTest-results/
          if-no-files-found: warn
