name: Instrumented Tests

# Android instrumented tests (the analog of Swift's XCUITest): builds the Compose
# sample app and drives login → home → RPC → logout in an Android emulator against
# an IN-APP MOCK (no node). This is the PR gate for UI behaviour.
#
# Node-backed / multi-user e2e is heavier (real merod, cross-user sync) and does
# NOT run here — it lives in android-e2e.yml (manual / main / weekly).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented-tests:
    name: connectedDebugAndroidTest (emulator, in-app mock)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the emulator. Without KVM the x86_64 emulator
      # boots under software rendering only and is far too slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD snapshot cache. ⚠️ RESTORE and SAVE are split on purpose.
      #
      # With the combined `actions/cache`, the save happens in the POST step — after
      # the test step has run the emulator and killed it — so what gets cached can be
      # an AVD captured mid-teardown. Restore that and the emulator boots far enough
      # for adb but never registers its system services:
      #
      #   android.os.ServiceManager$ServiceNotFoundException: No service published for: input
      #   ##[error]The process '…/platform-tools/adb' failed with exit code 1
      #
      # and the job then idles to `timeout-minutes` — 90 seconds of work reported as a
      # 45-minute failure. A static key cannot self-heal: every later run restores the
      # same bad snapshot, so RE-RUNNING NEVER HELPS. That is the tell.
      #
      # Seen 2026-09-09: the last green emulator run was the one that WROTE the cache
      # (main, 11:15Z); the next five timed out across three branches, one of which
      # changed only `docs/package-lock.json`. Deleting the cache made the same job
      # pass in under 3 minutes.
      #
      # Saving only right after a FRESH create means the cache can only ever hold a
      # pristine, just-snapshotted AVD — the emulator has not run tests against it
      # yet. Bumping the key alone would just reset the clock.
      - name: Restore AVD cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-x86_64-v2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Only on a miss, and only BEFORE anything runs tests against the AVD.
      - name: Save the pristine AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-x86_64-v2

      - name: Run instrumented tests (in-app mock)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NOTE: android-emulator-runner runs this script with /usr/bin/sh (dash), which does
          # NOT support `set -o pipefail`. Redirect to a log file (instead of piping through tee)
          # so the gradle exit code propagates and a real test failure fails the job.
          # Single-line gradle invocation: the action runs this under sh and backslash line
          # continuations don't survive (the `\` gets passed to gradle as a task name).
          # In-app mock only — node/multi-user e2e classes run in android-e2e.yml; filter them out.
          script: |
            ./gradlew :sample-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.calimero.mero.sample.AppE2ETest,com.calimero.mero.sample.ChatMultiUserTest --stacktrace > instrumented.log 2>&1 || { cat instrumented.log; exit 1; }
            cat instrumented.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-logs
          path: |
            instrumented.log
            sample-app/build/reports/androidTests/
            sample-app/build/outputs/androidTest-results/
          if-no-files-found: warn
