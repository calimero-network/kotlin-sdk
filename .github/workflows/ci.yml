name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace

      # Nothing else exercises the publishing wiring until a tag is pushed, which is
      # the worst moment to find out it is broken: a Central version can never be
      # re-published. This builds the real bundle and runs nmcp's own validation
      # against Central's rules — coordinates, javadoc jar, signatures, checksums —
      # with a throwaway key and no credentials, so a broken release config fails on
      # the pull request instead.
      - name: Release bundle is well-formed (no credentials needed)
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          cat > "$GNUPGHOME/params" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: CI Bundle Check
          Name-Email: ci@example.invalid
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --pinentry-mode loopback --gen-key "$GNUPGHOME/params"
          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --armor --export-secret-keys ci@example.invalid)" \
            ./gradlew nmcpZipAggregation -PVERSION_NAME=0.0.0-ci --stacktrace
          unzip -l build/nmcp/zip/aggregation.zip

      # The instrumented suites don't run here (no emulator on this job), but they
      # must at least compile — otherwise a UI rename silently rots the e2e tests
      # until the nightly emulator job runs.
      - name: Compile instrumented tests
        run: ./gradlew :sample-app:assembleDebugAndroidTest --stacktrace

      # Guard the SDK↔sample parity this repo is built on: every public SDK method
      # should be reachable from the sample app's operation registry.
      - name: SDK surface / registry parity
        run: ./ci/check-registry-parity.sh

      # Same pinned pair as the merobox workflows: pinning merobox alone pins
      # nothing, because calimero-client-py is an unpinned transitive dep that
      # tracks core's master. Schema-only, so no Docker and no fixture needed.
      - name: Validate merobox scenarios
        run: |
          python -m pip install --upgrade pip
          pip install 'merobox==0.6.75' 'calimero-client-py==0.7.0'
          for wf in ci/merobox/*.yml; do
            echo "── $wf"
            merobox bootstrap validate "$wf"
          done

      # A scenario pinning a node image that ci/core-version no longer names would
      # otherwise run the OLD node in the merobox lanes and report green.
      - name: Scenario node images match ci/core-version
        run: |
          set -euo pipefail
          . ./ci/core-version
          for wf in ci/merobox/*.yml; do
            declared=$(awk '/^  image:/{print $2; exit}' "$wf")
            [ "$declared" = "$MEROD_IMAGE" ] || {
              echo "::error file=$wf::pins $declared but ci/core-version says $MEROD_IMAGE"; exit 1; }
            echo "✓ $wf → $declared"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
