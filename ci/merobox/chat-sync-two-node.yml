# Two-node mero-chat message-sync check.
#
# Exercises the REAL published chat app (com.calimero.chat, downloaded from
# apps.calimero.network in CI) — the same app the Android chat sample installs —
# but on two Docker nodes instead of emulators. Creates a "Channel" context
# meshed across both nodes, sends a message on node 1, waits for the context
# hash to converge, and asserts node 2 reads the message back. This is the
# chat-app analog of sync-two-node.yml (kv-store), and the definitive,
# emulator-free proof that chat cross-node message sync works.
#
# The contract shape mirrors the sample app's
# sample-app/src/main/kotlin/com/calimero/mero/sample/chat/ChatService.kt
# (init params + send_message/get_messages args).
#
# ⚠️ This used to install `com.calimero.curb`, which is no longer published —
# `GET /api/v2/bundles?package=com.calimero.curb` answers `[]`, so the version
# lookup died on an empty list three lines from the cause. com.calimero.chat
# 3.1.1 takes the SAME init params, but `send_message` has NO `sender_username`
# argument (curb's did); passing it panics the guest at argument deserialization.
#
# The bundle is downloaded by the CI job to ./ci/merobox/res/chat-app.mpk
# (see .github/workflows/merobox-chat-sync.yml). It stays an .mpk: a dev install
# refuses a raw .wasm ("not a signed application bundle").
name: Two-node mero-chat message sync
description: A message sent on node 1 in a chat channel must replicate to node 2.

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:0.11.0-rc.32
  prefix: calimero-node

nuke_on_start: true
nuke_on_end: true
stop_all_nodes: true
wait_timeout: 120

steps:
  - name: Install mero-chat on node 1
    type: install_application
    node: calimero-node-1
    path: ./ci/merobox/res/chat-app.mpk
    dev: true
    outputs:
      app_id: applicationId

  # Create a "Channel" context (init params mirror ChatService.initParams) and
  # mesh node 2 into it. created_at is a fixed epoch — merobox scripts can't call
  # Date.now(), and the app only stores it.
  - name: Mesh a chat channel across node 1 + node 2
    type: create_mesh
    context_node: calimero-node-1
    application_id: "{{app_id}}"
    params: '{"name":"general","context_type":"Channel","description":"","created_at":1721800000,"creator_username":"host"}'
    nodes:
      - calimero-node-2
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  - name: Send a message on node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: send_message
    executor_public_key: "{{member_public_key}}"
    args:
      message: "hello from node 1"
      mentions: []
      mentions_usernames: []
      parent_message: null
      timestamp: 1721800001000
      files: null
      images: null

  - name: Wait for the channel state to converge across both nodes
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
    trigger_sync: true
    timeout: 90

  # A short settle between "the hash converged" and "read it back". `wait_for_sync`
  # polls contextStateHash, which agrees a moment before node 2's own execution
  # sees the new entry — this assertion failed once in three runs on exactly that
  # gap, with every step before it green. The kv-store lanes do not need it; a
  # chat message is a bigger entry through a slower path.
  - name: Let node 2 settle after convergence
    type: wait
    seconds: 5

  - name: Read messages back on node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get_messages
    args:
      parent_message: null
      limit: 50
      offset: 0
      search_term: null
    outputs:
      msgs_node2: result

  - name: Assert node 2 sees node 1's message
    type: assert
    statements:
      - "contains({{msgs_node2}}, 'hello from node 1')"
